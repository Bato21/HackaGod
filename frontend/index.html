<!DOCTYPE html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aletheia</title>
  <link rel="icon" type="image/png" sizes="32x32"  href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="forum.css?v=2" rel="stylesheet" />
  <link href="CardNav.css" rel="stylesheet" />
  <link href="PillNav.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0b0d;
      --bg-2: #111316;
      --bg-3: #1a1d22;
      --line: #23272e;
      --line-2: #2e333b;
      --text: #f5f5f4;
      --text-2: #a8a8a4;
      --text-3: #6b6e74;
      --accent: #facc15;
      --accent-2: #38bdf8;
      --good: #10b981;
      --bad: #dc2626;
      --warn: #f97316;
      --shadow: 0 12px 40px rgba(0,0,0,0.5);
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Montserrat", -apple-system, system-ui, sans-serif;
      --editorial: "Montserrat", Georgia, serif;
      /* Panel header — dark mode */
      --ph-bg: linear-gradient(160deg, #0d1117 0%, #161b27 55%, #1e3040 100%);
      --ph-border: rgba(56,189,248,0.2);
      --ph-text: #f0f4f8;
      --ph-muted: rgba(148,186,220,0.75);
      --ph-dot: #38bdf8;
      --ph-dot-glow: #38bdf8;
      --ph-btn-bg: rgba(255,255,255,0.07);
      --ph-btn-border: rgba(255,255,255,0.15);
      --ph-btn-color: rgba(255,255,255,0.55);
      --ph-follow-border: rgba(255,255,255,0.2);
      --ph-follow-bg: rgba(255,255,255,0.06);
      --ph-follow-color: rgba(255,255,255,0.55);
    }
    html[data-theme="light"] {
      --bg: #f5f4ef;
      --bg-2: #ffffff;
      --bg-3: #ebe9e1;
      --line: #d9d6cc;
      --line-2: #c4c0b3;
      --text: #1a1a1a;
      --text-2: #555;
      --text-3: #888;
      --shadow: 0 12px 40px rgba(40,30,10,0.08);
      --overlay-bg: rgba(255,255,255,0.88);
      /* Panel header — light mode */
      --ph-bg: linear-gradient(160deg, #1e3a5f 0%, #1d4ed8 60%, #2563eb 100%);
      --ph-border: rgba(37,99,235,0.3);
      --ph-text: #ffffff;
      --ph-muted: rgba(191,219,254,0.85);
      --ph-dot: #93c5fd;
      --ph-dot-glow: #60a5fa;
      --ph-btn-bg: rgba(255,255,255,0.12);
      --ph-btn-border: rgba(255,255,255,0.25);
      --ph-btn-color: rgba(255,255,255,0.75);
      --ph-follow-border: rgba(255,255,255,0.3);
      --ph-follow-bg: rgba(255,255,255,0.1);
      --ph-follow-color: rgba(255,255,255,0.8);
    }
    html[data-theme="corporate"] {
      /* ── Observatory Light — warm cream + amber gold (beta palette) */
      --bg:   #f5f1e8;
      --bg-2: #fdfaf3;
      --bg-3: #ece8de;
      --line:   #d8d3c4;
      --line-2: #c6c1b2;
      --text:   #0e0b18;
      --text-2: #2a2442;
      --text-3: #6a6480;
      --accent:   #c8921e;
      --accent-2: #4a8aaa;
      --good: #2e8a66;
      --bad:  #a42828;
      --warn: #b85820;
      --shadow: 0 12px 40px rgba(20,16,30,0.10);
      --navy:      #0e0c13;
      --navy-2:    #151220;
      --navy-3:    #1d1a2d;
      --navy-line: #252234;
      --navy-text: #ede9e0;
      --navy-muted:#a8a3b8;
      --corp-cyan:    #2a78b5;
      --corp-teal:    #196b62;
      --corp-violet:  #5a4898;
      --corp-emerald: #2a7a58;
      --corp-amber:   #c8921e;
      --corp-rose:    #a02c4a;
      --overlay-bg: rgba(253,250,243,0.96);
      --ph-bg: linear-gradient(160deg, #0e0c13 0%, #151220 55%, #1d1a2d 100%);
      --ph-border: rgba(230,184,64,0.25);
      --ph-text: #ede9e0;
      --ph-muted: rgba(168,163,184,0.85);
      --ph-dot: #e6b840;
      --ph-dot-glow: #f0c840;
      --ph-btn-bg: rgba(255,255,255,0.08);
      --ph-btn-border: rgba(255,255,255,0.14);
      --ph-btn-color: rgba(255,255,255,0.60);
      --ph-follow-border: rgba(230,184,64,0.30);
      --ph-follow-bg: rgba(230,184,64,0.08);
      --ph-follow-color: rgba(240,200,100,0.92);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      letter-spacing: -0.01em;
      overflow: hidden;
      height: 100vh;
    }
    button { font-family: inherit; color: inherit; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .editorial { font-family: var(--editorial);  font-weight: 500; letter-spacing: -0.015em; }

    /* Layout */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr 76px;
      /* Escala global de letras/UI. Contra-dimensionado para llenar el viewport
         exacto: zoom S × tamaño (1/S) = viewport real. */
      zoom: var(--label-scale, 1);
      height: calc(100vh / var(--label-scale, 1));
      width: calc(100vw / var(--label-scale, 1));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: relative;
      z-index: 10;
    }
    /* Bottom nav: oculto en desktop, el bloque @media 760px lo muestra */
    .mobile-nav { display: none; }
    /* Foro es takeover con su propia nav → esconder bottom-nav encima */
    body.forum-open .mobile-nav { display: none !important; }
    /* Barra de pestañas de ficha: solo mobile */
    .ficha-tabs { display: none; }

    /* Secciones colapsables del panel (ranking/filtros) */
    .sec-toggle {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      background: var(--bg-2);
      border: none;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 12px 16px;
      cursor: pointer;
      text-align: left;
    }
    .sec-toggle .sec-chev {
      width: 12px; height: 12px; flex-shrink: 0;
      transition: transform .18s ease;
      transform: rotate(-90deg);
      color: var(--accent);
    }
    .sec-toggle.open .sec-chev { transform: rotate(0deg); }
    .sec-toggle .sec-year {
      margin-left: auto; font-size: 10px;
      color: var(--text-3); font-weight: 400;
      text-transform: none;
    }
    .sec-toggle:hover { background: var(--bg-3); }

    /* Botón cerrar panel: solo mobile (el bloque @media lo muestra) */
    .panel-close-btn { display: none; }
    /* Desktop: el dashboard montado por tap (modo auto) NO debe abrir el
       modal; solo el botón "Expandir ficha" (dashMode='expand') lo abre.
       En mobile el bloque @media reaparece con la pestaña Información. */
    body.dash-auto .cd-backdrop { display: none; }
    .topbar .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .brand .logo {
      font-family: var(--editorial);
            font-weight: 500;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .brand .logo::before {
      content: "◆";
      font-size: 10px;
      color: var(--accent);
      margin-right: 8px;
      vertical-align: middle;
    }
    /* Greek brand name — Cinzel only on the ALETHEIA text */
    .brand .logo {
      font-family: "Montserrat", Georgia, serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand .logo-text {
      font-family: "Cinzel", Georgia, serif;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
    }
    .brand .tagline {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-3);
      text-transform: uppercase;
    }
    .topbar .meta {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .topbar .meta .pill {
      padding: 4px 10px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      cursor: pointer;
      transition: all .15s;
    }
    .topbar .meta .pill:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .main {
      display: grid;
      grid-template-columns: 300px 1fr 340px;
      min-height: 0;
      transition: grid-template-columns .35s cubic-bezier(.4,.0,.2,1);
    }
    .main.fullscreen {
      grid-template-columns: 0 1fr 0;
    }
    .main.fullscreen .col:first-child,
    .main.fullscreen .col:last-child {
      opacity: 0;
      pointer-events: none;
      border: none;
    }
    .col {
      border-right: 1px solid var(--line);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .col:last-child { border-right: none; border-left: 1px solid var(--line); }
    .col .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .col .header h2 {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0;
      color: var(--text-2);
      font-weight: 600;
    }
    .col .body { flex: 1; overflow-y: auto; min-height: 0; }
    .col .body::-webkit-scrollbar { width: 6px; }
    .col .body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
    .col .body::-webkit-scrollbar-track { background: transparent; }

    /* Left rail */
    .search-wrap {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .search {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: var(--sans);
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .filter-block {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-block .label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-3);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }
    .range-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .range-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .range-row .val {
      font-family: var(--mono);
      font-size: 11px;
      min-width: 26px;
      text-align: right;
      color: var(--text);
    }
    .sort-tabs {
      display: flex;
      gap: 4px;
      font-size: 11px;
    }
    .sort-tabs button {
      flex: 1;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text-2);
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 3px;
      font-family: var(--sans);
      transition: all .12s;
    }
    .sort-tabs button.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .sort-tabs button:hover:not(.active) { border-color: var(--text-2); color: var(--text); }

    .ranking-list { padding: 4px 0; }
    .rank-row {
      display: grid;
      grid-template-columns: 26px 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 8px 14px;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background .12s;
    }
    .rank-row:hover { background: var(--bg-2); }
    .rank-row.selected { background: var(--bg-2); border-left-color: var(--accent); }
    .rank-row.compared { background: var(--bg-2); border-left-color: var(--accent-2); }
    .rank-row .pos {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
    }
    .rank-row .name {
      font-size: 12.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-row .score {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
    }
    .rank-row .chip {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    /* Map area */
    .map-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .map-frame {
      flex: 1;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      z-index: 0;
      /* Look modo oscuro forzado en TODOS los temas (fondo siempre navy) */
      --bg: #0a0b0d;
      --bg-2: #111316;
      --bg-2-rgb: 17,19,22;
      --bg-3: #1a1d22;
      --overlay-bg: rgba(17,19,22,0.85);
      --line: #23272e;
      --line-2: #2e333b;
      --text: #f5f5f4;
      --text-2: #a8a8a4;
      --text-3: #6b6e74;
      --accent: #facc15;
      --accent-2: #38bdf8;
      --good: #10b981;
      --bad: #dc2626;
      --warn: #f97316;
      --shadow: 0 12px 40px rgba(0,0,0,0.5);
      --ph-bg: linear-gradient(160deg, #0d1117 0%, #161b27 55%, #1e3040 100%);
      --ph-border: rgba(56,189,248,0.2);
      --ph-text: #f0f4f8;
      --ph-muted: rgba(148,186,220,0.75);
      --ph-dot: #38bdf8;
      --ph-dot-glow: #38bdf8;
      --ph-btn-bg: rgba(255,255,255,0.07);
      --ph-btn-border: rgba(255,255,255,0.15);
      --ph-btn-color: rgba(255,255,255,0.55);
      --ph-follow-border: rgba(255,255,255,0.2);
      --ph-follow-bg: rgba(255,255,255,0.06);
      --ph-follow-color: rgba(255,255,255,0.55);
    }
    .map-frame svg:not(.leaflet-zoom-animated):not([class*="leaflet"]) {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    .map-frame svg.dragging { cursor: grabbing; }
    /* Al rotar el globo: sin labels ni transiciones → mucho más fluido,
       sobre todo en mobile (menos nodos que repintar por frame). */
    svg.dragging .country-label { display: none; }
    svg.dragging path { transition: none !important; }
    .map-frame svg .country-path,
    .map-frame svg .country-bubble {
      vector-effect: non-scaling-stroke;
    }
    .country-path {
      fill: var(--bg-3);
      stroke: rgba(0,0,0,0.55);
      stroke-width: 0.6px;
      transition: opacity .15s, stroke-width .12s, filter .15s;
      cursor: pointer;
    }
    html[data-theme="light"] .country-path { stroke: rgba(0,0,0,0.4); }
    .country-path:hover { filter: brightness(1.15) saturate(1.1); }
    .country-path.outside { fill: var(--bg-2); stroke: rgba(255,255,255,0.05); pointer-events: none; opacity: 0.55; }
    html[data-theme="light"] .country-path.outside { stroke: rgba(0,0,0,0.1); }
    .country-path.dim { opacity: 0.15; }
    .country-path.selected { stroke: var(--accent); stroke-width: 1.5px; }
    .country-path.compared { stroke: var(--accent-2); stroke-width: 1.5px; }
    .country-bubble {
      fill-opacity: 0.75;
      stroke: rgba(255,255,255,0.35);
      stroke-width: 1px;
      cursor: pointer;
      transition: opacity .15s;
    }
    html[data-theme="light"] .country-bubble { stroke: rgba(0,0,0,0.25); }
    .country-label {
      font-family: var(--mono);
      font-size: 9px;
      fill: var(--text);
      text-anchor: middle;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 3px;
      pointer-events: none;
      letter-spacing: 0.04em;
    }
    .country-label.outside-label {
      fill: var(--text-3);
      font-size: 7.5px;
      stroke-width: 2.5px;
      letter-spacing: 0;
    }
    .graticule { fill: none; stroke: var(--line); stroke-width: 0.4px; opacity: 0.4; }
    .sphere { fill: var(--bg-2); stroke: var(--line); stroke-width: 0.5px; }

    /* ── Fondo del globo = fondo del login (gradiente navy + mapa animado) ── */
    .globe-stage-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(160deg, #071221 0%, #0f2237 45%, #0a1d30 100%);
      pointer-events: none;
    }
    /* Malla + glows como el login (.auth-stage::before) */
    .globe-stage-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 30%, rgba(14,165,233,0.22), transparent 48%),
        radial-gradient(circle at 80% 68%, rgba(124,58,237,0.14), transparent 48%),
        radial-gradient(circle at 55% 10%, rgba(13,148,136,0.10), transparent 38%),
        repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,0.022) 39px 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,0.022) 39px 40px);
      pointer-events: none;
    }
    /* Mapa Leaflet sin tiles: deja ver el fondo globo (gradiente+malla) */
    .map-frame .globe-stage-bg ~ .leaflet-container,
    .map-frame .globe-stage-bg ~ .leaflet-container .leaflet-pane,
    .map-frame .globe-stage-bg ~ .leaflet-container .leaflet-tile-pane {
      background: transparent !important;
    }
    /* Neutraliza el zoom global SOLO en el render del mapa (Leaflet / globo SVG):
       escala neta 1 → hit-testing correcto y tamaño real. Los overlays
       (leyenda, título, panel) y el resto de la app sí escalan. Las letras
       del mapa crecen vía su propio calc(* --label-scale). */
    .map-frame .leaflet-container,
    .map-frame .globe-stage-bg ~ svg {
      zoom: calc(1 / var(--label-scale, 1));
    }
    /* Globo sobre el fondo: agua celeste, grilla y países "exteriores"
       tenues — forzado en cualquier tema. */
    .map-frame .globe-stage-bg ~ svg .sphere {
      fill: url(#globeWater);
      stroke: rgba(120, 210, 245, 0.60);
      stroke-width: 0.6px;
    }
    html[data-theme="corporate"] .map-frame .globe-stage-bg ~ svg .sphere,
    html[data-theme="light"] .map-frame .globe-stage-bg ~ svg .sphere {
      fill: url(#globeWater);
      stroke: rgba(120, 210, 245, 0.60);
    }
    /* Malla técnica sobre el agua */
    .map-frame .globe-stage-bg ~ svg .sphere-mesh {
      fill: url(#globeMesh);
      stroke: none;
    }
    .map-frame .globe-stage-bg ~ svg .graticule {
      stroke: rgba(94, 200, 230, 0.32);
      stroke-width: 0.5px;
      opacity: 0.7;
    }
    .map-frame .globe-stage-bg ~ svg .country-path.outside {
      fill: rgba(120, 150, 195, 0.10);
      stroke: rgba(120, 150, 195, 0.20);
    }

    .map-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 1000;
    }
    .map-title {
      top: 14px;
      left: 18px;
      max-width: 60%;
      background: rgba(10,11,14,0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 6px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .map-title .kicker {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .map-title .h {
      font-family: var(--editorial);
            font-size: 28px;
      font-weight: 500;
      line-height: 1.05;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .map-title .sub {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-2);
      max-width: 380px;
      line-height: 1.45;
    }

    .map-legend {
      left: 18px;
      top: 14px;
      background: rgba(var(--bg-2-rgb, 22,27,34), 0.82);
      border: 1px solid var(--line);
      padding: 12px 16px;
      pointer-events: auto;
      min-width: 260px;
      max-width: 260px;
      backdrop-filter: blur(8px);
      border-radius: 4px;
    }

    /* Map settings popover */
    .map-settings-pop {

    .map-settings-pop .mp-head {

      justify-content: space-between;

    .map-settings-pop .mp-head .mp-close {

      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 3px;

    .mp-section .mp-lbl {

    .mp-seg.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .mp-seg.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .mp-seg button {
      background: transparent;
      border: 1px solid var(--line-2);

    .mp-seg button.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .mp-palette-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mp-palette {
      background: var(--bg);
      border: 1px solid var(--line-2);

      gap: 5px;

    .mp-palette.active { border-color: var(--accent); background: rgba(250,204,21,0.06); }
    .mp-palette .pal-name {
      font-size: 10.5px;
      color: var(--text);

    }
    .mp-palette .pal-bar {

    .mp-toggle {

      align-items: center;
      padding: 4px 0;

    .mp-toggle .sw {
      position: relative;
      width: 32px;
      height: 18px;

      border-radius: 999px;
      border: 1px solid var(--line-2);
      cursor: pointer;
      transition: all .15s;
    }
    .mp-toggle .sw::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      width: 14px;
      height: 14px;
      background: var(--text-2);
      border-radius: 50%;
      transition: transform .15s, background .15s;

    .mp-toggle .sw.on { background: var(--accent); border-color: var(--accent); }
    .mp-toggle .sw.on::after { transform: translateX(14px); background: var(--bg); }

    /* Country focus panel — overlay sobre el mapa */
    .country-focus {

    /* ── Risk signals panel ── */
    .risk-panel {
      position: absolute; top: 0; right: 0; bottom: 0; width: 440px;

    .rp-group-count {

    }
    .rp-country { font-size: 13px; font-weight: 600; color: var(--text); }

    .rp-item-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    /* ── CountryRiskModal ─────────────────────────────────────── */
    .crm-backdrop {
      position: fixed; inset: 0; z-index: 9200;
      background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      animation: ob-in 0.18s ease;
    }
    .crm-card {
      background: var(--bg);

      width: 100%; max-width: 720px;
      max-height: 88vh;
      display: flex; flex-direction: column;
      overflow: hidden;

    }
    .crm-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 20px 20px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0;

    .crm-kicker { font-size: 10px; font-family: monospace; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }

    .crm-summary {

    .crm-cat {
      padding: 16px; border-right: 1px solid var(--line);

    .crm-cat-h {

    .crm-item:last-child { border-bottom: none; margin-bottom: 0; }
    .crm-item-title { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.45; }

    .country-focus .cf-head {
      padding: 18px 22px 20px;
      background: var(--ph-bg);
      border-bottom: 1px solid var(--ph-border);
      flex-shrink: 0;
    }
    .country-focus .cf-head .cf-kicker {

      border-top: 5px solid var(--text);

    .cf-bar-scale {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-3);
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    .cf-indicators {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .cf-indicator {
      border: 1px solid var(--line);
      padding: 10px 12px;
      border-radius: 3px;
    }
    .cf-indicator .ind-lb {
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .cf-indicator .ind-val {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
    }
    .cf-indicator .ind-unit {
      font-size: 11px;
      color: var(--text-3);
      margin-left: 4px;
    }

    .cf-event {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px dotted var(--line);
    }
    .cf-event:first-of-type { border-top: none; padding-top: 4px; }
    .cf-event .ev-date {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.03em;
    }
    .cf-event .ev-sector {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .cf-event .ev-text {
      font-size: 12.5px;
      color: var(--text);
      line-height: 1.45;
    }

    .cf-headline {
      padding: 10px 0;
      border-top: 1px dotted var(--line);
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 12px;
      align-items: baseline;
    }
    .cf-headline:first-of-type { border-top: none; padding-top: 4px; }
    .cf-headline .hl-src {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .cf-headline .hl-text {
      font-family: var(--editorial);
            font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
    }

    .cf-actions {
      padding: 14px 22px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: var(--bg-2);
    }
    .cf-action-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--text);
      padding: 10px 12px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      font-family: var(--sans);
      transition: all .12s;
    }
    .cf-action-btn:hover { border-color: var(--accent); }
    .cf-action-btn.primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .cf-action-btn.primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #1a1a1a;
    }

    .cf-disclaimer {
      padding: 12px 22px;
      font-size: 10px;
      color: var(--text-3);
      line-height: 1.5;
      background: var(--bg-2);
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    .cf-disclaimer .mono { color: var(--text-2); }

    /* Compare toggle button */
    .cf-action-btn.compare {
      position: relative;
      transition: all .15s;
    }
    .cf-action-btn.compare .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      margin-right: 8px;
      transition: all .15s;
      vertical-align: middle;
      box-shadow: none;
    }
    .cf-action-btn.compare.on {
      border-color: var(--accent-2);
      color: var(--text);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }
    .cf-action-btn.compare.on .dot {
      background: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
      animation: pulse-glow 1.6s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25); }
      50%      { box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.08); }
    }

    /* Compare hint banner */
    .compare-hint {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-2);
      border: 1px solid var(--accent-2);
      box-shadow: 0 8px 30px rgba(0,0,0,0.35), 0 0 0 3px rgba(56,189,248,0.1);
      padding: 10px 16px;
      border-radius: 999px;
      z-index: 25;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: hint-in .25s ease;
    }
    @keyframes hint-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .compare-hint .ch-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.25);
      animation: pulse-glow 1.6s ease-in-out infinite;
    }
    .compare-hint .ch-text {
      font-size: 11.5px;
      color: var(--text);
      letter-spacing: 0.04em;
    }
    .compare-hint .ch-text strong { color: var(--accent-2); font-weight: 600; }
    .compare-hint .ch-cancel {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 11px;
      text-decoration: underline;
      padding: 0;
    }
    .compare-hint .ch-cancel:hover { color: var(--text); }

    /* Compare result inside country focus */
    .cf-compare {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(250,204,21,0.04), rgba(56,189,248,0.04));
    }
    .cf-compare .cmp-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
    }
    .cf-compare .cmp-card {
      padding: 10px 12px;
      border: 1px solid var(--line-2);
      border-radius: 3px;
      background: var(--bg-2);
    }
    .cf-compare .cmp-card.a { border-color: var(--accent); }
    .cf-compare .cmp-card.b { border-color: var(--accent-2); }
    .cf-compare .cmp-card .cn {
      font-size: 10.5px;
      color: var(--text-2);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .cf-compare .cmp-card .cv {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .cf-compare .cmp-vs {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.1em;
    }
    .cf-compare .cmp-conclusion {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 10px;
      line-height: 1.5;
    }
    .cf-compare .cmp-clear {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 10.5px;
      text-decoration: underline;
      padding: 6px 0 0;
    }
    .cf-compare .cmp-clear:hover { color: var(--text); }

    /* ── Auth / Login screen ────────────────────────────────────────── */
    /* ── Auth stage: full-screen navy background ──────────────── */
    .auth-stage {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: linear-gradient(160deg, #071221 0%, #0f2237 45%, #0a1d30 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 64px;
      gap: 64px;
      overflow: hidden;
    }
    .auth-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 30%, rgba(14,165,233,0.22), transparent 48%),
        radial-gradient(circle at 80% 68%, rgba(124,58,237,0.14), transparent 48%),
        radial-gradient(circle at 55% 10%, rgba(13,148,136,0.10), transparent 38%),
        repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,0.022) 39px 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,0.022) 39px 40px);
      pointer-events: none;
    }
    /* NOTA responsive login: las media queries de auth viven DESPUÉS de las
       reglas base (~línea 1441/1488) para ganar la cascada — están en el
       bloque @media (max-width:760px) y @media (max-width:420px) más abajo.
       Poner overrides aquí (antes del base) NO funciona: misma especificidad,
       el base posterior gana. */

    .auth-world-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.75;
    }

    .sa-parent { overflow: visible !important; }
    .sa-unit { display: inline-block; will-change: transform, opacity; }

    /* ── Left hero content ─────────────────────────────────────── */
    .auth-hero {
      position: relative;
      z-index: 1;
      flex: 0 1 560px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 500px;
      max-height: 640px;
      align-self: center;
    }
    .auth-hero .ah-brand { position: relative; }
    .auth-hero .ah-logo {
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.06em;
      color: #eef4fc;
    }
    .auth-hero .ah-logo::before {

      color: #38bdf8;
      margin-right: 10px;
      vertical-align: middle;

    .auth-hero .ah-tagline {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7fa3c8;
    }
    .auth-hero .ah-headline { max-width: 560px; }
    .auth-hero .ah-headline h2 {
      font-family: var(--editorial);

      letter-spacing: -0.025em;

    }
    .auth-hero .ah-headline h2 + h2 { margin-bottom: 22px; }
    .auth-hero .ah-headline .ah-h2-sub { color: #5a7fa8; }
    .auth-hero .ah-headline p {
      font-size: 14px;
      line-height: 1.65;
      color: #7fa3c8;
      margin: 0;
      max-width: 460px;
    }
    .auth-hero .ah-stats {
      display: flex;
      gap: 40px;
      padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .auth-hero .ah-stat .lb {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #7fa3c8;
    }
    .auth-hero .ah-stat .vl {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 500;

    .auth-hero .ah-foot {
      font-size: 10px;
      color: #4a6a8a;

    }

    /* ── Floating card ─────────────────────────────────────────── */
    .auth-form {
      position: relative;
      z-index: 1;
      width: 420px;
      flex-shrink: 0;
      background: #0d1a2e;

      box-shadow:
        0 32px 80px rgba(0,0,0,0.7),
        0 4px 16px rgba(0,0,0,0.5),

    .auth-form .af-wrap { width: 100%; }
    .auth-form .af-kicker {

      color: #e6b840;

    }
    .auth-form .af-title {
      font-family: "Cinzel", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.1;
      color: #eef4fc;
      margin: 0 0 28px;
    }
    .auth-tabs {
      display: flex;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 22px;
    }
    .auth-tabs button {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(180,176,200,0.85);
      padding: 8px 10px;
      font-size: 11.5px;
      font-family: var(--sans);
      letter-spacing: 0.04em;
      cursor: pointer;
      border-radius: 6px;
      transition: all .15s;
    }
    .auth-tabs button.active {
      background: linear-gradient(135deg, #e6b840, #c8921e);
      color: #0e0c13;
      font-weight: 600;
    }
    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .auth-field label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(168,163,184,0.8);
    }
    .auth-field input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);

      font-family: var(--sans);

      font-size: 13px;
      border-radius: 8px;

    .auth-field input:focus {

      box-shadow: 0 0 0 3px rgba(230,184,64,0.18);
    }
    .auth-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(168,163,184,0.85);

    }
    .auth-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .auth-row a { color: #e6b840; text-decoration: none; }
    .auth-row a:hover { text-decoration: underline; }
    .auth-submit {
      width: 100%;
      background: linear-gradient(135deg, #e6b840, #c8921e);

      border: none;

      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 8px;

    .auth-submit:active { transform: translateY(1px); }
    .auth-error {
      color: #fca5a5;

      letter-spacing: 0.02em;

    .auth-divider {

      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

      content: "";

      height: 1px;
      background: rgba(255,255,255,0.10);

    .auth-guest {

      background: transparent;
      border: 1px dashed rgba(255,255,255,0.2);
      color: rgba(168,163,184,0.75);
      padding: 11px 14px;
      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 8px;
      transition: all .15s;
    }
    .auth-guest:hover { border-style: solid; border-color: #e6b840; color: #e6b840; background: rgba(230,184,64,0.07); }
    .auth-foot {
      font-size: 10px;
      color: rgba(168,163,184,0.55);

    .auth-foot .mono { color: rgba(168,163,184,0.8); }

    /* Mobile brand header (hidden on desktop) */
    .auth-mobile-brand { display: none; }

    /* User chip in topbar */
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      transition: border-color .12s;
    }
    .user-chip:hover { border-color: var(--accent); }
    .user-chip .uc-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #1a1a1a;
      font-family: var(--editorial);
            font-weight: 600;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .user-chip.guest .uc-avatar { background: var(--bg-3); color: var(--text-2); border: 1px dashed var(--line-2); }
    .user-chip .uc-name {
      font-size: 11px;
      color: var(--text);
      letter-spacing: 0.04em;
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-right: 2px;
    }
    .user-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--bg-2);
      border: 1px solid var(--line-2);

      min-width: 200px;
      z-index: 50;

    .user-menu .um-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .user-menu .um-item.danger { color: var(--bad); }

    /* ── Foro ──────────────────────────────────────────────────────── */
    .forum-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(10,11,13,0.55);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      backdrop-filter: blur(14px) saturate(120%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      animation: cd-in 0.3s ease;
    }
    html[data-theme="light"] .forum-backdrop { background: rgba(245,244,239,0.55); }

    html[data-theme="dark"] .fvt-logo::before { color: #facc15; }

    html[data-theme="light"] .fvt-logo { color: #c8921e; letter-spacing: 0.05em; }
    html[data-theme="light"] .fvt-logo::before { color: #c8921e; }
    html[data-theme="light"] .fvt-slash { color: rgba(200,146,30,0.3); }
    html[data-theme="light"] .fvt-name { color: rgba(26,26,26,0.55); }

    html[data-theme="light"] .fvt-new-btn { background: #c8921e; color: #fff; border: none; font-weight: 700; }
    html[data-theme="light"] .fvt-new-btn:hover { background: #a07018; }
    .forum-shell {
      width: 100%;
      max-width: 780px;
      height: 100%;
      max-height: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);

      grid-template-rows: auto 1fr auto;

    .forum-head {

      border-bottom: 1px solid var(--line);

      justify-content: space-between;
      align-items: flex-end;
    }
    .forum-head .fh-kicker {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .forum-head .fh-title {
      font-family: var(--editorial);
            font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
    }
    .forum-head .fh-meta {
      display: flex;
      gap: 14px;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-top: 8px;
    }
    .forum-head .live-dot {
      display: inline-block;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--good);
      margin-right: 6px;
      vertical-align: middle;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
      animation: pulse-glow-green 1.6s ease-in-out infinite;
    }
    @keyframes pulse-glow-green {
      0%, 100% { box-shadow: 0 0 0 3px rgba(16,185,129,0.25); }
      50%      { box-shadow: 0 0 0 6px rgba(16,185,129,0.08); }
    }
    .forum-head .fh-close {
      background: none;
      border: 1px solid var(--line-2);
      color: var(--text-2);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .forum-head .fh-close:hover { color: var(--text); border-color: var(--text); }

    .forum-body {
      overflow-y: auto;
      padding: 18px 24px 24px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .forum-body::-webkit-scrollbar { width: 8px; }
    .forum-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

    .forum-empty {
      text-align: center;
      color: var(--text-3);
      padding: 60px 20px;
      font-size: 13px;
    }

    .forum-post {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 14px;
      padding: 12px 0;
      border-top: 1px dotted var(--line);
      animation: post-in .22s ease-out;
    }
    .forum-post:first-of-type { border-top: none; padding-top: 0; }
    @keyframes post-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .forum-post .fp-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--editorial);
            font-weight: 600;
      font-size: 14px;
      color: #1a1a1a;
    }
    .forum-post.is-bot .fp-avatar { border: 1px dashed var(--line-2); background: var(--bg-3); color: var(--text-2); }
    .forum-post.is-user .fp-avatar { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); }
    .forum-post.is-guest .fp-avatar { background: var(--bg-3); color: var(--text-2); border: 1px solid var(--line-2); }
    .forum-post .fp-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
      color: var(--text);
      flex-wrap: wrap;
    }
    .forum-post .fp-meta .nm { font-weight: 500; }
    .forum-post .fp-meta .hd { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); letter-spacing: 0.02em; }
    .forum-post .fp-meta .ts { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-left: auto; }
    .forum-post .fp-meta .tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--line-2);
      color: var(--text-3);
    }
    .forum-post .fp-meta .tag.you { border-color: var(--accent); color: var(--accent); }
    .forum-post .fp-text {
      margin-top: 5px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .forum-post .fp-actions {
      margin-top: 6px;
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--text-3);
    }
    .forum-post .fp-like {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 0;
      font-family: var(--sans);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .forum-post .fp-like:hover { color: var(--text); }
    .forum-post .fp-like.liked { color: var(--accent); }
    .forum-post .fp-like svg { width: 12px; height: 12px; }

    .forum-composer {
      border-top: 1px solid var(--line);
      padding: 14px 20px;
      background: var(--bg-2);
      display: grid;
      grid-template-columns: 32px 1fr auto;
      gap: 12px;
      align-items: end;
    }
    .forum-composer .fc-av {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--editorial);
            font-weight: 600;
      font-size: 12px;
      color: #1a1a1a;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .forum-composer .fc-av.guest {
      background: var(--bg-3);
      color: var(--text-2);
      border: 1px dashed var(--line-2);
    }
    .forum-composer textarea {
      width: 100%;
      min-height: 38px;
      max-height: 120px;
      resize: vertical;
      background: var(--bg);
      border: 1px solid var(--line-2);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 4px;
      outline: none;
      line-height: 1.4;
      transition: border-color .12s;
    }
    .forum-composer textarea:focus { border-color: var(--accent); }
    .forum-composer .fc-send {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 9px 16px;
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
      transition: background .15s;
      height: 38px;
    }
    .forum-composer .fc-send:hover { background: var(--accent); color: #1a1a1a; }
    .forum-composer .fc-send:disabled { background: var(--line-2); color: var(--text-3); cursor: not-allowed; }
    .forum-composer .fc-foot {
      grid-column: 2 / span 2;
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: 0.04em;
      margin-top: 6px;
    }

    /* Full dashboard modal — backdrop blureado */
    .cd-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(10,11,13,0.55);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      backdrop-filter: blur(14px) saturate(120%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      animation: cd-in 0.3s ease;
    }
    html[data-theme="light"] .cd-backdrop { background: rgba(245,244,239,0.55); }
    @keyframes cd-in { from { opacity: 0; } to { opacity: 1; } }
    .cd-shell {
      width: 100%;
      max-width: 1320px;
      height: 100%;
      max-height: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      border-radius: 6px;
      animation: cd-pop 0.32s cubic-bezier(.4,0,.2,1);
    }
    @keyframes cd-pop {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .cd-head {
      padding: 22px 28px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
    }
    .cd-head .cd-kicker {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .cd-head .cd-name {
      font-family: var(--editorial);
            font-size: 56px;
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1;
      color: var(--text);
    }
    .cd-head .cd-sub {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 8px;
      display: flex;
      gap: 18px;
      font-family: var(--mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .cd-head-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }
    .cd-score-big {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .cd-score-big .vn {
      font-family: var(--mono);
      font-size: 72px;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.85;
    }
    .cd-score-big .vo { font-family: var(--mono); font-size: 14px; color: var(--text-3); }
    .cd-head-actions { display: flex; gap: 8px; }
    .cd-btn {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--text);
      padding: 8px 14px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      font-family: var(--sans);
      transition: all .12s;
    }
    .cd-btn:hover { border-color: var(--accent); }
    .cd-btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .cd-btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #1a1a1a; }

    .cd-body {
      overflow-y: auto;
      padding: 24px 28px 28px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      align-content: start;
    }
    .cd-body::-webkit-scrollbar { width: 8px; }
    .cd-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

    .cd-card {
      border: 1px solid var(--line);
      padding: 18px 20px;
      border-radius: 4px;
      background: var(--bg);
    }
    .milestones-list {
      margin: 6px 0 0;
      padding-left: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .milestones-list li {
      position: relative;
      padding-left: 16px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-2);
    }
    .milestones-list li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--accent);
    }
    .cd-card .cd-card-h {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .cd-card.span-2 { grid-column: 1 / -1; }

    /* Presidente card */
    .cd-pres {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 16px;
      align-items: center;
    }
    .cd-pres .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--bg-3), var(--line-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--editorial);
            font-weight: 600;
      font-size: 22px;
      color: var(--text);
      border: 1px solid var(--line-2);
    }
    .cd-pres .pres-name {
      font-family: var(--editorial);
            font-size: 24px;
      font-weight: 500;
      line-height: 1.05;
      color: var(--text);
    }
    .cd-pres .pres-meta {
      font-size: 11px;
      color: var(--text-2);
      margin-top: 6px;
      letter-spacing: 0.04em;
    }
    .cd-pres .pres-meta .badge {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-right: 8px;
      color: var(--text);
    }
    .pres-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .pres-stat {
      border: 1px dashed var(--line);
      padding: 8px 12px;
      border-radius: 3px;
    }
    .pres-stat .lb { font-size: 9.5px; letter-spacing: 0.1em; color: var(--text-3); text-transform: uppercase; }
    .pres-stat .vl {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      margin-top: 2px;
    }
    .pres-stat .bar { height: 4px; background: var(--bg-3); border-radius: 1px; margin-top: 6px; overflow: hidden; }
    .pres-stat .bar i { display: block; height: 100%; background: var(--text-2); }

    /* Gabinete */
    .cabinet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cabinet-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-top: 1px dotted var(--line);
    }
    .cabinet-row:first-of-type, .cabinet-row:nth-of-type(2) { border-top: none; }
    .cabinet-row .port {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .cabinet-row .min { font-size: 12px; color: var(--text); }
    .cabinet-row .min .stance {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: block;
      margin-top: 1px;
    }
    .cabinet-row .risk {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--good);
    }
    .cabinet-row.at-risk .risk { background: var(--bad); }
    .cabinet-row.at-risk .min .stance { color: var(--bad); }

    /* Contexto */
    .ctx-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
    }
    .ctx-cell { padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; }
    .ctx-cell .lb { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
    .ctx-cell .vl { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text); }
    .ctx-cell .un { font-size: 11px; color: var(--text-3); margin-left: 4px; }

    /* Timeline extendida */
    .cd-timeline { position: relative; padding-left: 16px; }
    .cd-timeline::before {
      content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px;
      width: 1px; background: var(--line-2);
    }
    .cd-timeline .tl-item {
      position: relative;
      padding: 10px 0 10px 14px;
    }
    .cd-timeline .tl-item::before {
      content: "";
      position: absolute;
      left: -16px;
      top: 14px;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--accent);
    }
    .cd-timeline .tl-date {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .cd-timeline .tl-sector {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-left: 10px;
    }
    .cd-timeline .tl-text {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      margin-top: 3px;
    }

    .cd-headlines .cd-headline {
      padding: 12px 0;
      border-top: 1px dotted var(--line);
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 14px;
    }
    .cd-headlines .cd-headline:first-of-type { border-top: none; padding-top: 4px; }
    .cd-headlines .hl-src { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
    .cd-headlines .hl-text {
      font-family: var(--editorial);
            font-size: 16px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }
    .map-zoom-controls {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
      z-index: 1000;
    }
    .map-zoom-btn {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      color: var(--text-2);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      transition: all .12s;
      padding: 0;
      font-family: var(--mono);
      font-size: 16px;
      line-height: 1;
    }
    .map-zoom-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .map-zoom-btn svg { width: 12px; height: 12px; }
    .zoom-level {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-3);
      text-align: center;
      padding: 2px 0;
      letter-spacing: 0.05em;
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      padding: 10px 12px;
      min-width: 180px;
      box-shadow: var(--shadow);
      z-index: 50;
      transform: translate(-50%, calc(-100% - 12px));
      transition: opacity .1s;
    }
    .tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%) rotate(45deg);
      width: 10px; height: 10px;
      background: var(--bg-2);
      border-right: 1px solid var(--line-2);
      border-bottom: 1px solid var(--line-2);
    }
    .tooltip .tn {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 2px;
      font-weight: 500;
    }
    .tooltip .tr {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }
    .tooltip .tv {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .tooltip .tv .num {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 500;
    }
    .tooltip .tv .of { color: var(--text-3); font-size: 10px; font-family: var(--mono); }
    .tooltip .delta {
      font-family: var(--mono);
      font-size: 10px;
      margin-top: 4px;
      color: var(--text-3);
    }
    .tooltip .delta .up { color: var(--bad); }
    .tooltip .delta .dn { color: var(--good); }

    /* Timeline */
    .timeline {
      border-top: 1px solid var(--line);
      background: var(--bg-2);
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .play-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line-2);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
    }
    .play-btn:hover { border-color: var(--accent); }
    .play-btn svg { width: 12px; height: 12px; }
    .timeline-track {
      flex: 1;
      position: relative;
      height: 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .timeline-track .axis {
      position: absolute;
      left: 0; right: 0;
      top: 16px;
      height: 2px;
      background: var(--line);
    }
    .timeline-track .ticks {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 38px;
    }
    .timeline-track .tick {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
      z-index: 2;
    }
    .timeline-track .tick .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--bg-2);
      border: 1.5px solid var(--text-3);
      transition: all .12s;
    }
    .timeline-track .tick:hover .dot { border-color: var(--text); }
    .timeline-track .tick.active .dot {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(250,204,21,0.15);
    }
    .timeline-track .tick .lb {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      transition: color .12s;
    }
    .timeline-track .tick.active .lb { color: var(--text); }
    .timeline .year-display {
      font-family: var(--editorial);
            font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.02em;
      min-width: 80px;
      text-align: right;
    }

    /* Right panel */
    .detail-empty {
      padding: 20px 18px;
    }
    .detail-empty .h {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .top-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .top-block .tb-title {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .top-block .tb-title .note { font-family: var(--mono); color: var(--text-3); letter-spacing: 0.04em; text-transform: none; }
    .top-row {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }
    .top-row .pos { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
    .top-row .bar-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .top-row .bar { height: 4px; flex: 1; background: var(--bg-3); position: relative; border-radius: 1px; }
    .top-row .bar .fill { height: 100%; border-radius: 1px; }
    .top-row .score { font-family: var(--mono); font-size: 11px; min-width: 32px; text-align: right; }
    .top-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }

    .regional-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .regional-row {
      display: grid;
      grid-template-columns: 1fr 80px auto;
      gap: 10px;
      align-items: center;
      padding: 6px 0;
    }
    .regional-row .rn { font-size: 12px; }
    .regional-row .rb { height: 4px; background: var(--bg-3); border-radius: 1px; position: relative; }
    .regional-row .rb .rf { height: 100%; border-radius: 1px; }
    .regional-row .rv { font-family: var(--mono); font-size: 12px; min-width: 32px; text-align: right; }

    /* Country detail */
    .detail-panel {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .detail-panel .dn {
      font-family: var(--editorial);
            font-size: 26px;
      font-weight: 500;
      line-height: 1.1;
      color: var(--text);
    }
    .detail-panel .dr {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-top: 4px;
      display: flex;
      gap: 14px;
    }
    .big-score {
      margin-top: 16px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .big-score .bn {
      font-family: var(--mono);
      font-size: 56px;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .big-score .bo {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-3);
    }
    .big-score .bl {
      font-size: 11px;
      color: var(--text-2);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-left: auto;
      text-align: right;
    }
    .detail-bar {
      height: 6px;
      margin-top: 14px;
      background: var(--palette-gradient, linear-gradient(to right, rgb(52,153,110), rgb(206,178,78), rgb(178,60,60)));
      position: relative;
      border-radius: 1px;
    }
    .detail-bar .marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 12px;
      background: var(--text);
      transform: translateX(-50%);
    }
    .detail-bar .marker::after {
      content: "";
      position: absolute;
      top: -4px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 4px solid var(--text);
    }

    /* ── Contexto del país: población + descripción ── */
    .ctx-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .ctx-row {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    .ctx-pop { display: flex; align-items: baseline; gap: 6px; }
    .ctx-pop-n {
      font-size: 20px; font-weight: 700; color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .ctx-pop-u { font-size: 11px; color: var(--text-3); }
    .ctx-pop-t {
      font-size: 11px; color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    }
    .ctx-desc {
      font-size: 12px; color: var(--text-2); line-height: 1.55;
      margin-top: 10px; text-wrap: pretty;
    }
    .ctx-desc.clamp {
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .ctx-more {
      background: none; border: none; color: var(--accent);
      font-size: 11px; cursor: pointer; padding: 6px 0 0;
      font-family: inherit;
    }
    .ctx-more:hover { text-decoration: underline; }
    .cd-card .ctx-pop { margin-bottom: 4px; }
    .cd-card .ctx-pop-t { margin-left: 8px; }
    .cd-card .ctx-desc { margin-top: 8px; }

    /* ── CountryAIAnalysis card ───────────────────────────────── */
    .ai-card { grid-column: 1 / -1; }
    .ai-loading { display: flex; align-items: center; gap: 12px; padding: 18px 0; }
    .ai-spinner {
      width: 18px; height: 18px; flex: none;
      border: 2px solid rgba(127,127,127,0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: ai-spin 0.9s linear infinite;
    }
    @keyframes ai-spin { to { transform: rotate(360deg); } }
    .ai-status { font-size: 12px; color: var(--text-2); font-family: monospace; }
    .ai-error {
      padding: 14px; border-radius: 8px;
      background: rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.3);
    }
    .ai-error-title { font-size: 12px; font-weight: 700; color: #f87171; margin-bottom: 4px; }
    .ai-error-msg { font-size: 11px; color: var(--text-2); }
    .ai-body { padding: 4px 0; }
    .ai-body .ai-h {
      font-size: 13px; font-weight: 700; color: var(--text);
      margin: 14px 0 6px; letter-spacing: 0.02em;
    }
    .ai-body .ai-h:first-child { margin-top: 0; }
    .ai-body .ai-para {
      font-size: 12.5px; color: var(--text-2); line-height: 1.6;
      margin: 6px 0;
    }
    .ai-body .ai-list {
      margin: 4px 0 8px; padding-left: 20px;
      list-style: disc;
    }
    .ai-body .ai-list li {
      font-size: 12.5px; color: var(--text-2); line-height: 1.55;
      margin: 4px 0;
    }
    .ai-body .ai-foot {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px dashed var(--line);
      font-size: 10px; font-style: italic; color: var(--text-3);
      font-family: monospace;
    }
    .spark-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .spark-block .st {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .spark-svg {
      width: 100%;
      height: 60px;
      display: block;
    }
    .spark-line { fill: none; stroke: var(--accent); stroke-width: 1.5px; }
    .spark-area { fill: var(--accent); fill-opacity: 0.12; }
    .spark-dot { fill: var(--accent); }
    .spark-dot.year { fill: var(--text); }
    .spark-axis-lb { font-family: var(--mono); font-size: 9px; fill: var(--text-3); }

    .compare-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .compare-block .cb-empty {
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.4;
    }
    .compare-add-btn {
      background: transparent;
      border: 1px dashed var(--line-2);
      color: var(--text-2);
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      width: 100%;
      margin-top: 8px;
      transition: all .12s;
    }
    .compare-add-btn:hover { border-style: solid; border-color: var(--accent-2); color: var(--text); }
    .compare-pair {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
    .compare-pair .cp-card {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
    }
    .compare-pair .cp-card .cpn { font-size: 11px; color: var(--text-2); margin-bottom: 4px; }
    .compare-pair .cp-card .cpv { font-family: var(--mono); font-size: 20px; font-weight: 500; }
    .compare-pair .vs { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
    .compare-clear {
      font-size: 10px;
      color: var(--text-3);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px 0;
      margin-top: 6px;
    }
    .compare-clear:hover { color: var(--text); }

    /* Notes modal */
    .notes-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .notes-card {
      background: var(--bg);
      border: 1px solid var(--line-2);
      max-width: 580px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 32px;
      box-shadow: var(--shadow);
    }
    .meth-src {
      list-style: none; margin: 6px 0 10px; padding: 0;
    }
    .meth-src li {
      font-size: 12.5px; color: var(--text-2);
      padding: 7px 0 7px 16px; position: relative;
      border-bottom: 1px solid var(--line);
      line-height: 1.5;
    }
    .meth-src li:last-child { border-bottom: none; }
    .meth-src li::before {
      content: ""; position: absolute; left: 0; top: 13px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--good);
    }
    .meth-src li b { color: var(--text); font-weight: 600; }
    .meth-def li::before { background: var(--text-3); }
    .meth-num {
      list-style: decimal; padding-left: 22px; margin: 6px 0 12px;
    }
    .meth-num li {
      padding: 5px 0; border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .meth-num li::before { display: none; }
    .meth-num li:last-child { border-bottom: none; }
    .meth-num li b { color: var(--text); }
    .meth-table-wrap { overflow-x: auto; margin: 6px 0 14px; }
    .meth-table {
      width: 100%; border-collapse: collapse; font-size: 11px;
      color: var(--text-2);
    }
    .meth-table th, .meth-table td {
      border: 1px solid var(--line); padding: 6px 8px;
      text-align: left; vertical-align: top;
    }
    .meth-table th {
      background: var(--bg-2); color: var(--text);
      font-weight: 600; position: sticky; top: 0;
    }
    .meth-table td { max-width: 320px; overflow-wrap: anywhere; }
    .meth-table a { color: var(--accent-2); word-break: break-all; }
    @media (max-width: 760px) {
      .meth-table { font-size: 10px; }
      .meth-table td { max-width: 180px; }
    }
    .notes-card h3 {
      font-family: var(--editorial);
            font-size: 24px;
      font-weight: 500;
      margin: 0 0 16px 0;
    }
    .notes-card p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-2);
      margin: 0 0 12px 0;
    }
    .notes-card .nh {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-top: 18px;
      margin-bottom: 6px;
    }
    .notes-close {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
      margin-top: 16px;
      border-radius: 2px;
    }

    /* ── News rail (panel izquierdo cuando se selecciona un país) ───── */
    .news-rail {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .news-rail-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .news-rail-back {
      background: none;
      border: none;
      color: var(--text-3);
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0;
      cursor: pointer;
      text-align: left;
      transition: color .12s;
      align-self: flex-start;
    }
    .news-rail-back:hover { color: var(--accent); }
    .news-rail-country {
      font-family: var(--editorial);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.05;
    }
    .news-rail-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.06em;
      color: var(--text-3);
      text-transform: uppercase;
    }
    .news-rail-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .news-rail-body::-webkit-scrollbar { width: 6px; }
    .news-rail-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    .news-section {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .news-section-h {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .news-section-h .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .news-section-h .count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--text-3);
      font-weight: 400;
      letter-spacing: 0.04em;
    }
    .news-section.corrupcion  .dot { background: var(--bad); }
    .news-section.politica    .dot { background: var(--accent-2); }
    .news-section.gobierno    .dot { background: var(--accent); }
    .news-section.gobernanza  .dot { background: #5eead4; }

    /* ── World News Panel (right rail, no country selected) ─── */
    .world-news-panel {
      display: flex;
      flex-direction: column;
      gap: 0;
      height: 100%;
      overflow-y: auto;
      padding: 0 0 16px;
    }
    .world-news-panel::-webkit-scrollbar { width: 4px; }
    .world-news-panel::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }
    .wnp-hint {
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.6;
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }
    .wnp-header-label {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 10px;
    }
    .wnp-foot {
      font-size: 10px;
      color: var(--text-3);
      text-align: center;
      margin-top: 18px;
      opacity: 0.5;
    }

    .news-item {
      padding: 10px 0;
      border-top: 1px dotted var(--line);
    }
    .news-item:first-of-type {
      border-top: none;
      padding-top: 2px;
    }
    .news-item.news-item-risk {
      border-left: 3px solid #eab308; /* sobreescrito inline por riskColor() */
      padding-left: 10px;
      background: rgba(234,179,8,0.06);
      border-radius: 4px;
      margin: 6px 0;
    }
    .news-item.news-item-risk .ni-title {
      font-weight: 700;
    }
    .news-item.news-item-risk .ni-source {
      color: var(--accent);
      font-weight: 600;
    }
    .news-item .ni-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--text-3);
      letter-spacing: 0.04em;
      margin-bottom: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .news-item .ni-meta .ni-source {
      color: var(--text-2);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .news-item .ni-title {
      font-size: 12px;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 8px;
      text-wrap: pretty;
    }
    .news-item a.ni-title-link {
      display: block;
      text-decoration: none;
      transition: color 0.15s;
    }
    .news-item a.ni-title-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .news-item .ni-summary {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.5;
      margin: -2px 0 8px;
      text-wrap: pretty;
    }
    .news-item .ni-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .news-item .ni-sector {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .news-item .ni-discuss {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--text-2);
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 3px;
      transition: all .12s;
      white-space: nowrap;
    }
    .news-item .ni-discuss:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(250, 204, 21, 0.06);
    }

    /* ── Leaflet overrides ─────────────────────────────── */
    .leaflet-container {
      background: #0d1117 !important;
      font-family: var(--mono);
    }
    html[data-theme="light"] .leaflet-container {
      background: #e8edf2 !important;
    }
    html[data-theme="corporate"] .leaflet-container {
      background: #dde3eb !important;
    }
    .leaflet-attribution-flag { display: none !important; }
    .leaflet-control-attribution {
      background: rgba(10,11,13,0.65) !important;
      color: var(--text-3) !important;
      font-size: 9px !important;
      backdrop-filter: blur(4px);
    }
    html[data-theme="corporate"] .leaflet-control-attribution {
      background: rgba(13,27,42,0.7) !important;
    }
    /* News POI tooltip */
    .news-poi-tooltip .leaflet-tooltip-content,
    .news-poi-tooltip {
      background: rgba(10,11,15,0.96) !important;
      border: 1px solid rgba(255,255,255,0.12) !important;
      border-radius: 8px !important;
      padding: 8px 12px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
      color: #f5f5f4 !important;
      font-family: var(--mono) !important;
    }
    .news-poi-tooltip.leaflet-tooltip::before {
      border-top-color: rgba(10,11,15,0.96) !important;
    }
    /* Region labels (low zoom) */
    .map-region-name {
      pointer-events: none;
      white-space: nowrap;
    }
