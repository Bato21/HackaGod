    .cd-headlines .cd-headline {
      padding: 12px 0;
      border-top: 1px dotted var(--line);
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 14px;
    }
    .cd-headlines .cd-headline:first-of-type { border-top: none; padding-top: 4px; }
    .cd-headlines .hl-src { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
    .cd-headlines .hl-text {
      font-family: var(--editorial);
            font-size: 16px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }
    .map-zoom-controls {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: auto;
      z-index: 1000;
    }
    .map-zoom-btn {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      color: var(--text-2);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      transition: all .12s;
      padding: 0;
      font-family: var(--mono);
      font-size: 16px;
      line-height: 1;
    }
    .map-zoom-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }
    .map-zoom-btn svg { width: 12px; height: 12px; }
    .zoom-level {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-3);
      text-align: center;
      padding: 2px 0;
      letter-spacing: 0.05em;
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      padding: 10px 12px;
      min-width: 180px;
      box-shadow: var(--shadow);
      z-index: 50;
      transform: translate(-50%, calc(-100% - 12px));
      transition: opacity .1s;
    }
    .tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%) rotate(45deg);
      width: 10px; height: 10px;
      background: var(--bg-2);
      border-right: 1px solid var(--line-2);
      border-bottom: 1px solid var(--line-2);
    }
    .tooltip .tn {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 2px;
      font-weight: 500;
    }
    .tooltip .tr {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }
    .tooltip .tv {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .tooltip .tv .num {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 500;
    }
    .tooltip .tv .of { color: var(--text-3); font-size: 10px; font-family: var(--mono); }
    .tooltip .delta {
      font-family: var(--mono);
      font-size: 10px;
      margin-top: 4px;
      color: var(--text-3);
    }
    .tooltip .delta .up { color: var(--bad); }
    .tooltip .delta .dn { color: var(--good); }

    /* Timeline */
    .timeline {
      border-top: 1px solid var(--line);
      background: var(--bg-2);
      padding: 14px 20px 12px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .play-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line-2);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
    }
    .play-btn:hover { border-color: var(--accent); }
    .play-btn svg { width: 12px; height: 12px; }
    .timeline-track {
      flex: 1;
      position: relative;
      height: 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .timeline-track .axis {
      position: absolute;
      left: 0; right: 0;
      top: 16px;
      height: 2px;
      background: var(--line);
    }
    .timeline-track .ticks {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 38px;
    }
    .timeline-track .tick {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 4px;
      z-index: 2;
    }
    .timeline-track .tick .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--bg-2);
      border: 1.5px solid var(--text-3);
      transition: all .12s;
    }
    .timeline-track .tick:hover .dot { border-color: var(--text); }
    .timeline-track .tick.active .dot {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(250,204,21,0.15);
    }
    .timeline-track .tick .lb {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
      transition: color .12s;
    }
    .timeline-track .tick.active .lb { color: var(--text); }
    .timeline .year-display {
      font-family: var(--editorial);
            font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.02em;
      min-width: 80px;
      text-align: right;
    }

    /* Right panel */
    .detail-empty {
      padding: 20px 18px;
    }
    .detail-empty .h {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .top-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .top-block .tb-title {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .top-block .tb-title .note { font-family: var(--mono); color: var(--text-3); letter-spacing: 0.04em; text-transform: none; }
    .top-row {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }
    .top-row .pos { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
    .top-row .bar-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .top-row .bar { height: 4px; flex: 1; background: var(--bg-3); position: relative; border-radius: 1px; }
    .top-row .bar .fill { height: 100%; border-radius: 1px; }
    .top-row .score { font-family: var(--mono); font-size: 11px; min-width: 32px; text-align: right; }
    .top-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }

    .regional-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .regional-row {
      display: grid;
      grid-template-columns: 1fr 80px auto;
      gap: 10px;
      align-items: center;
      padding: 6px 0;
    }
    .regional-row .rn { font-size: 12px; }
    .regional-row .rb { height: 4px; background: var(--bg-3); border-radius: 1px; position: relative; }
    .regional-row .rb .rf { height: 100%; border-radius: 1px; }
    .regional-row .rv { font-family: var(--mono); font-size: 12px; min-width: 32px; text-align: right; }

    /* Country detail */
    .detail-panel {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .detail-panel .dn {
      font-family: var(--editorial);
            font-size: 26px;
      font-weight: 500;
      line-height: 1.1;
      color: var(--text);
    }
    .detail-panel .dr {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-top: 4px;
      display: flex;
      gap: 14px;
    }
    .big-score {
      margin-top: 16px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .big-score .bn {
      font-family: var(--mono);
      font-size: 56px;
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .big-score .bo {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-3);
    }
    .big-score .bl {
      font-size: 11px;
      color: var(--text-2);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-left: auto;
      text-align: right;
    }
    .detail-bar {
      height: 6px;
      margin-top: 14px;
      background: var(--palette-gradient, linear-gradient(to right, rgb(52,153,110), rgb(206,178,78), rgb(178,60,60)));
      position: relative;
      border-radius: 1px;
    }
    .detail-bar .marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 12px;
      background: var(--text);
      transform: translateX(-50%);
    }
    .detail-bar .marker::after {
      content: "";
      position: absolute;
      top: -4px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 4px solid var(--text);
    }

    .spark-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .spark-block .st {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-3);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .spark-svg {
      width: 100%;
      height: 60px;
      display: block;
    }
    .spark-line { fill: none; stroke: var(--accent); stroke-width: 1.5px; }
    .spark-area { fill: var(--accent); fill-opacity: 0.12; }
    .spark-dot { fill: var(--accent); }
    .spark-dot.year { fill: var(--text); }
    .spark-axis-lb { font-family: var(--mono); font-size: 9px; fill: var(--text-3); }

    .compare-block {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .compare-block .cb-empty {
      font-size: 11px;
      color: var(--text-3);
      line-height: 1.4;
    }
    .compare-add-btn {
      background: transparent;
      border: 1px dashed var(--line-2);
      color: var(--text-2);
      padding: 8px 12px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      width: 100%;
      margin-top: 8px;
      transition: all .12s;
    }
    .compare-add-btn:hover { border-style: solid; border-color: var(--accent-2); color: var(--text); }
    .compare-pair {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }
    .compare-pair .cp-card {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
    }
    .compare-pair .cp-card .cpn { font-size: 11px; color: var(--text-2); margin-bottom: 4px; }
    .compare-pair .cp-card .cpv { font-family: var(--mono); font-size: 20px; font-weight: 500; }
    .compare-pair .vs { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
    .compare-clear {
      font-size: 10px;
      color: var(--text-3);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px 0;
      margin-top: 6px;
    }
    .compare-clear:hover { color: var(--text); }

    /* Notes modal */
    .notes-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .notes-card {
      background: var(--bg);
      border: 1px solid var(--line-2);
      max-width: 580px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 32px;
      box-shadow: var(--shadow);
    }
    .notes-card h3 {
      font-family: var(--editorial);
            font-size: 24px;
      font-weight: 500;
      margin: 0 0 16px 0;
    }
    .notes-card p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-2);
      margin: 0 0 12px 0;
    }
    .notes-card .nh {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-top: 18px;
      margin-bottom: 6px;
    }
    .notes-close {
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
      margin-top: 16px;
      border-radius: 2px;
    }

    /* ── News rail (panel izquierdo cuando se selecciona un país) ───── */
    .news-rail {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .news-rail-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .news-rail-back {
      background: none;
      border: none;
      color: var(--text-3);
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0;
      cursor: pointer;
      text-align: left;
      transition: color .12s;
      align-self: flex-start;
    }
    .news-rail-back:hover { color: var(--accent); }
    .news-rail-country {
      font-family: var(--editorial);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.05;
    }
    .news-rail-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.06em;
      color: var(--text-3);
      text-transform: uppercase;
    }
    .news-rail-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .news-rail-body::-webkit-scrollbar { width: 6px; }
    .news-rail-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    .news-section {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .news-section-h {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .news-section-h .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .news-section-h .count {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--text-3);
      font-weight: 400;
      letter-spacing: 0.04em;
    }
    .news-section.corrupcion .dot { background: var(--bad); }
    .news-section.politica   .dot { background: var(--accent-2); }
    .news-section.gobierno   .dot { background: var(--accent); }

    .news-item {
      padding: 10px 0;
      border-top: 1px dotted var(--line);
    }
    .news-item:first-of-type {
      border-top: none;
      padding-top: 2px;
    }
    .news-item .ni-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--text-3);
      letter-spacing: 0.04em;
      margin-bottom: 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .news-item .ni-meta .ni-source {
      color: var(--text-2);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .news-item .ni-title {
      font-size: 12px;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 8px;
      text-wrap: pretty;
    }
    .news-item .ni-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .news-item .ni-sector {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }
    .news-item .ni-discuss {
      background: transparent;
      border: 1px solid var(--line-2);
      color: var(--text-2);
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 3px;
      transition: all .12s;
      white-space: nowrap;
    }
    .news-item .ni-discuss:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(250, 204, 21, 0.06);
    }

    /* ── Leaflet overrides ─────────────────────────────── */
    .leaflet-container {
      background: #0d1117 !important;
      font-family: var(--mono);
    }
    html[data-theme="light"] .leaflet-container {
      background: #e8edf2 !important;
    }
    html[data-theme="corporate"] .leaflet-container {
      background: #dde3eb !important;
    }
    .leaflet-attribution-flag { display: none !important; }
    .leaflet-control-attribution {
      background: rgba(10,11,13,0.65) !important;
      color: var(--text-3) !important;
      font-size: 9px !important;
      backdrop-filter: blur(4px);
    }
    html[data-theme="corporate"] .leaflet-control-attribution {
      background: rgba(13,27,42,0.7) !important;
    }
    /* Region labels (low zoom) */
    .map-region-name {
      pointer-events: none;
      white-space: nowrap;
    }
    .map-region-name span {
      display: inline-block;
      font-family: var(--editorial);
      font-size: 13px;
      font-weight: 600;
      color: rgba(20,30,50,0.6);
      text-shadow:
        0 0 4px rgba(255,255,255,0.95),
        0 0 8px rgba(255,255,255,0.8);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      transform: translate(-50%, -50%);
    }
    html[data-theme="dark"] .map-region-name span {
      color: rgba(200,215,240,0.65);
      text-shadow:
        0 0 5px rgba(0,0,0,0.95),
        0 0 10px rgba(0,0,0,0.8);
    }

    /* Spanish country name labels */
    .map-country-name {
      pointer-events: none;
      white-space: nowrap;
    }
    .map-country-name span {
      display: inline-block;
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      color: rgba(20,30,50,0.85);
      text-shadow:
        0 0 3px rgba(255,255,255,0.9),
        0 0 6px rgba(255,255,255,0.7),
        1px 1px 0 rgba(255,255,255,0.8);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      transform: translate(-50%, -50%);
    }
    html[data-theme="dark"] .map-country-name span {
      color: rgba(220,230,245,0.92);
      text-shadow:
        0 0 4px rgba(0,0,0,0.9),
        0 0 8px rgba(0,0,0,0.7),
        1px 1px 0 rgba(0,0,0,0.8);
    }

    /* ISO labels */
    .map-iso-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      text-align: center;
      letter-spacing: 0.06em;
      text-shadow: 0 0 3px rgba(0,0,0,0.8), 0 0 6px rgba(0,0,0,0.5);
      pointer-events: none;
      white-space: nowrap;
      line-height: 14px;
    }
    html[data-theme="corporate"] .map-iso-label { color: rgba(255,255,255,0.95); }
    /* Hide default Leaflet zoom controls (we use custom ones) */
    .leaflet-control-zoom { display: none !important; }
    /* Map frame needs a defined height for Leaflet */
    .map-frame { min-height: 0; }

    /* Loading */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .loading::before {
      content: "";
      display: inline-block;
      width: 10px; height: 10px;
      border: 1.5px solid var(--text-3);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ══ CORPORATE THEME: VIVID ══════════════════════════════════════ */

    /* Topbar — gradient navy with cyan-glow bottom line */
    html[data-theme="corporate"] .topbar {
      background: linear-gradient(135deg, #0b1829 0%, #0f2440 45%, #0b1829 100%);
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(to right, #0ea5e9, #7c3aed, #0d9488) 1;
    }
    html[data-theme="corporate"] .brand .logo { color: var(--navy-text); }
    html[data-theme="corporate"] .brand .logo::before { color: #38bdf8; }
    html[data-theme="corporate"] .brand .tagline { color: var(--navy-muted); }
    html[data-theme="corporate"] .topbar .meta { color: var(--navy-muted); }
    html[data-theme="corporate"] .topbar .meta .pill {
      border-color: var(--navy-3); color: var(--navy-muted);
      transition: all .15s;
    }
    html[data-theme="corporate"] .topbar .meta .pill:hover {
      border-color: #38bdf8; color: #38bdf8;
      background: rgba(56,189,248,0.08);
    }
    html[data-theme="corporate"] .user-chip { border-color: var(--navy-3); }
    html[data-theme="corporate"] .user-chip .uc-name { color: var(--navy-text); }
    html[data-theme="corporate"] .user-chip .uc-tag  { color: var(--navy-muted); }
    html[data-theme="corporate"] .user-chip:hover { border-color: #38bdf8; }
    html[data-theme="corporate"] .user-chip .uc-avatar {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
    }

    /* Left column header — violet accent */
    html[data-theme="corporate"] .main > .col:first-child .header {
      background: linear-gradient(90deg, #1b1050 0%, #1b3050 100%);
      border-bottom: 2px solid #7c3aed;
    }
    html[data-theme="corporate"] .main > .col:first-child .header h2 { color: #c4b5fd; }

    /* Right column header — emerald accent */
    html[data-theme="corporate"] .main > .col:last-child .header {
      background: linear-gradient(90deg, #042f2e 0%, #0d2f2a 100%);
      border-bottom: 2px solid #0d9488;
    }
    html[data-theme="corporate"] .main > .col:last-child .header h2 { color: #5eead4; }

    html[data-theme="corporate"] .col { border-color: var(--navy-line); }

    /* Timeline — deep gradient + vivid year dots */
    html[data-theme="corporate"] .timeline {
      background: linear-gradient(90deg, #0b1829 0%, #0f2440 50%, #0b1829 100%);
      border-top: 2px solid transparent;
      border-image: linear-gradient(to right, #0ea5e9, #7c3aed, #0d9488) 1;
    }
    html[data-theme="corporate"] .timeline .year-display {
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56,189,248,0.3);
    }
    html[data-theme="corporate"] .timeline .tick .lb { color: var(--navy-muted); }
    html[data-theme="corporate"] .timeline .tick.active .lb { color: #38bdf8; }
    html[data-theme="corporate"] .timeline .tick.active .dot {
      background: #0ea5e9;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 4px rgba(14,165,233,0.25);
    }
    html[data-theme="corporate"] .play-btn {
      background: var(--navy-3); border-color: #0ea5e9; color: #38bdf8;
    }
    html[data-theme="corporate"] .play-btn:hover {
      background: #0ea5e9; color: #fff;
    }
    html[data-theme="corporate"] .timeline-track .axis { background: var(--navy-3); }

    /* Rank rows — left border color by score */
    html[data-theme="corporate"] .rank-row.selected {
      background: rgba(14,165,233,0.06);
      border-left-color: #0ea5e9;
    }
    html[data-theme="corporate"] .rank-row:hover { background: rgba(14,165,233,0.04); }
    html[data-theme="corporate"] .rank-row .pos { color: #7fa3c8; }

    /* Search + filter inputs */
    html[data-theme="corporate"] .search:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
    }

    /* Sort tabs */
    html[data-theme="corporate"] .sort-tabs button.active {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
      border-color: transparent;
      color: #fff;
    }

    /* Filter range accent */
    html[data-theme="corporate"] input[type="range"] { accent-color: #0ea5e9; }

    /* Map overlays — colored left borders */
    html[data-theme="corporate"] .map-stats {
      border-left: 3px solid #0ea5e9;
    }
    html[data-theme="corporate"] .map-stats .stat .vl { color: #0ea5e9; }
    html[data-theme="corporate"] .map-legend {
      border-left: 3px solid #059669;
    }
    html[data-theme="corporate"] .map-title .h {
      color: #0d1b2a;
      text-shadow: 0 1px 3px rgba(255,255,255,0.6);
    }

    /* Map overlay cards — frosted glass for light themes */
    html[data-theme="light"] .map-stats,
    html[data-theme="corporate"] .map-stats,
    html[data-theme="light"] .map-legend,
    html[data-theme="corporate"] .map-legend {
      background: var(--overlay-bg);
      border-color: rgba(0,0,0,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    html[data-theme="light"] .map-title .h,
    html[data-theme="corporate"] .map-title .h {
      text-shadow: 0 1px 4px rgba(255,255,255,0.7), 0 0 12px rgba(255,255,255,0.5);
    }
    html[data-theme="light"] .map-title .sub,
    html[data-theme="corporate"] .map-title .sub {
      text-shadow: 0 1px 3px rgba(255,255,255,0.6);
    }
    html[data-theme="corporate"] .map-title .kicker { color: var(--text-3); }
    html[data-theme="corporate"] .map-title .sub { color: var(--text-2); }

    /* Map action buttons */
    html[data-theme="corporate"] .map-action-btn {
      background: rgba(255,255,255,0.9);
      border-color: var(--line-2);
      backdrop-filter: blur(8px);
    }
    html[data-theme="corporate"] .map-action-btn:hover {
      border-color: #0ea5e9; color: #0ea5e9;
    }
    html[data-theme="corporate"] .map-action-btn.active {
      border-color: #0ea5e9; background: rgba(14,165,233,0.08); color: #0ea5e9;
    }

    /* Zoom controls */
    html[data-theme="corporate"] .map-zoom-controls { background: rgba(255,255,255,0.92); border-color: var(--line); }
    html[data-theme="corporate"] .map-zoom-btn:hover { color: #0ea5e9; }

    /* Big score in detail panel */
    html[data-theme="corporate"] .big-score .bn { color: #0ea5e9; }
    html[data-theme="corporate"] .detail-bar {
      background: linear-gradient(to right, #059669, #84cc16, #facc15, #f97316, #b91c1c);
    }

    /* Sparkline */
    html[data-theme="corporate"] .spark-line { stroke: #0ea5e9; }
    html[data-theme="corporate"] .spark-area { fill: #0ea5e9; fill-opacity: 0.08; }
    html[data-theme="corporate"] .spark-dot { fill: #0ea5e9; }

    /* Top-10 bars */
    html[data-theme="corporate"] .top-row .bar { background: var(--bg-3); }

    /* Country focus panel */
    html[data-theme="corporate"] .country-focus {
      border-left: 3px solid #0ea5e9;
    }
    html[data-theme="corporate"] .cf-action-btn.primary {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
      border-color: transparent; color: #fff;
    }
    html[data-theme="corporate"] .cf-action-btn.primary:hover {
      background: linear-gradient(135deg, #0284c7, #6d28d9);
    }

    /* News rail dot colors */
    html[data-theme="corporate"] .news-section.corrupcion .dot { background: #e11d48; }
    html[data-theme="corporate"] .news-section.politica   .dot { background: #7c3aed; }
    html[data-theme="corporate"] .news-section.gobierno   .dot { background: #0ea5e9; }
    html[data-theme="corporate"] .ni-discuss:hover {
      border-color: #0ea5e9; color: #0ea5e9;
      background: rgba(14,165,233,0.06);
    }

    /* ── Forum topbar ── */
    html[data-theme="corporate"] .fv-topbar {
      background: linear-gradient(135deg, #0b1829 0%, #0f2440 55%, #0b1829 100%);
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(to right, #0ea5e9, #7c3aed, #0d9488) 1;
    }
    html[data-theme="corporate"] .fvt-logo,
    html[data-theme="corporate"] .fvt-slash,
    html[data-theme="corporate"] .fvt-name { color: var(--navy-text); }
    html[data-theme="corporate"] .fvt-logo::before { color: #38bdf8; }
    html[data-theme="corporate"] .fvt-live { color: var(--navy-muted); border-color: var(--navy-3); }
    html[data-theme="corporate"] .fvt-search-input {
      background: rgba(255,255,255,0.08); border-color: var(--navy-3);
      color: var(--navy-text);
    }
    html[data-theme="corporate"] .fvt-search-input::placeholder { color: var(--navy-muted); }
    html[data-theme="corporate"] .fvt-search-input:focus {
      border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
    }
    html[data-theme="corporate"] .fvt-filter-btn {
      background: rgba(255,255,255,0.08); border-color: var(--navy-3); color: var(--navy-muted);
    }
    html[data-theme="corporate"] .fvt-filter-btn:hover,
    html[data-theme="corporate"] .fvt-filter-btn.is-open { border-color: #38bdf8; color: #38bdf8; }
    html[data-theme="corporate"] .fvt-filter-btn.has-active { background: rgba(56,189,248,0.1); }
    html[data-theme="corporate"] .fvt-icon-btn {
      background: rgba(255,255,255,0.08); border-color: var(--navy-3); color: var(--navy-muted);
    }
    html[data-theme="corporate"] .fvt-icon-btn:hover { border-color: #38bdf8; color: #38bdf8; }
    html[data-theme="corporate"] .fvt-close-btn {
      border-color: var(--navy-3); color: var(--navy-muted);
    }
    html[data-theme="corporate"] .fvt-close-btn:hover { border-color: #e11d48; color: #fda4af; }
    html[data-theme="corporate"] .fvt-new-btn {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed); color: #fff; border: none;
    }
    html[data-theme="corporate"] .fvt-new-btn:hover {
      background: linear-gradient(135deg, #0284c7, #6d28d9);
    }

    /* Forum scope bar */
    html[data-theme="corporate"] .fv-scope-bar {
      background: linear-gradient(135deg, #0f2036 0%, #132035 100%);
      border-bottom-color: var(--navy-line);
    }
    html[data-theme="corporate"] .fv-scope-tab { color: var(--navy-muted); }
    html[data-theme="corporate"] .fv-scope-tab:hover { color: var(--navy-text); }
    html[data-theme="corporate"] .fv-scope-tab.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    html[data-theme="corporate"] .fv-scope-tab.scope-gobierno.active { color: #a78bfa; border-bottom-color: #a78bfa; }
    html[data-theme="corporate"] .fv-scope-tab.scope-tema.active    { color: #fb923c; border-bottom-color: #fb923c; }
    html[data-theme="corporate"] .fv-scope-count { background: rgba(255,255,255,0.08); color: var(--navy-muted); }
    html[data-theme="corporate"] .fv-scope-tab.active .fv-scope-count {
      background: rgba(56,189,248,0.15); color: #38bdf8;
    }
    html[data-theme="corporate"] .fv-sort-lbl { color: var(--navy-muted); }
    html[data-theme="corporate"] .fv-sort-btn { color: var(--navy-muted); }
    html[data-theme="corporate"] .fv-sort-btn:hover { color: var(--navy-text); border-color: var(--navy-3); }
    html[data-theme="corporate"] .fv-sort-btn.active {
      color: var(--navy-text); background: var(--navy-3); border-color: var(--navy-line);
    }

    /* Forum cards */
    html[data-theme="corporate"] .fv-card.selected { background: rgba(14,165,233,0.04); }
    html[data-theme="corporate"] .fv-card.selected::after { background: #0ea5e9; }
    html[data-theme="corporate"] .fv-card:hover { background: rgba(14,165,233,0.02); }

    /* Forum detail head */
    html[data-theme="corporate"] .fvd-head { background: var(--bg-2); }
    html[data-theme="corporate"] .fvd-send {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed); color: #fff;
    }
    html[data-theme="corporate"] .fvd-send:hover {
      background: linear-gradient(135deg, #0284c7, #6d28d9);
    }

    /* Inline reply send button */
    html[data-theme="corporate"] .fv-inline-send {
      background: #0ea5e9; color: #fff;
    }

    /* Map */
    html[data-theme="corporate"] .country-path { stroke: rgba(13,27,42,0.28); }
    html[data-theme="corporate"] .country-path.outside { stroke: rgba(13,27,42,0.07); }
    html[data-theme="corporate"] .sphere { fill: #e8f0fb; stroke: #c8d8ee; }
    html[data-theme="corporate"] .graticule { stroke: #c0cfdf; }

    /* Scrollbars */
    html[data-theme="corporate"] .col .body::-webkit-scrollbar-thumb,
    html[data-theme="corporate"] .fvd-body::-webkit-scrollbar-thumb,
    html[data-theme="corporate"] .fvl-scroll::-webkit-scrollbar-thumb { background: #bec9de; }


    /* Map settings pop */
    html[data-theme="corporate"] .mp-seg button.active {
      background: linear-gradient(135deg, #0ea5e9, #7c3aed);
      border-color: transparent; color: #fff;
    }
    html[data-theme="corporate"] .mp-palette.active { border-color: #0ea5e9; background: rgba(14,165,233,0.05); }

    /* Legend bar */
    html[data-theme="corporate"] .legend-bar {
      background: linear-gradient(to right, #059669, #84cc16, #facc15, #f97316, #b91c1c) !important;
    }

    /* ── Profile Page (full-screen takeover) ─────────────────── */
    .pp-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 2500;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pp-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Nav bar */
    .pp-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      flex-shrink: 0;
    }
    .pp-nav-left { display: flex; align-items: center; gap: 16px; }
    .pp-nav-right { display: flex; align-items: center; gap: 8px; }
    .pp-back {
      background: none;
      border: none;
      color: var(--text-3);
      cursor: pointer;
      font-size: 13px;
      font-family: var(--sans);
      padding: 6px 10px;
      border-radius: 6px;
      transition: all .12s;
    }
    .pp-back:hover { color: var(--text); background: var(--bg-3); }
    .pp-nav-title {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
    }
    .pp-btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--line-2);
      background: transparent;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--sans);
      transition: all .12s;
    }
    .pp-btn:hover { border-color: var(--text-2); color: var(--text); }
    .pp-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pp-btn.primary:hover { filter: brightness(1.1); }
    html[data-theme="dark"] .pp-btn.primary { color: #0a0b0d; }

    /* Scrollable body */
    .pp-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .pp-body::-webkit-scrollbar { width: 6px; }
    .pp-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    /* Banner */
    .pp-banner {
      height: 140px;
      position: relative;
      flex-shrink: 0;
    }
    .pp-banner-presets {
      position: absolute;
      bottom: 12px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pp-bp-lbl {
      font-size: 11px;
      color: rgba(255,255,255,0.7);
      font-weight: 500;
    }
    .pp-bp {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      cursor: pointer;
      transition: border-color .15s, transform .12s;
    }
    .pp-bp:hover { border-color: rgba(255,255,255,0.9); transform: scale(1.1); }
    .pp-bp.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.35); }

    /* Hero row */
    .pp-hero {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 0 28px 24px;
      margin-top: -48px;
      position: relative;
    }
    .pp-avatar-wrap { position: relative; flex-shrink: 0; }
    .pp-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 4px solid var(--bg);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .pp-avatar-initials {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .pp-avatar-edit {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--bg-3);
      border: 1.5px solid var(--line-2);
      color: var(--text-2);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .12s;
    }
    .pp-avatar-edit:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    .pp-identity {
      flex: 1;
      padding-top: 52px;
      min-width: 0;
    }
    .pp-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .pp-email { font-size: 12px; color: var(--text-3); margin-top: 4px; }
    .pp-since { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .pp-rep-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid;
      border-radius: 999px;
      padding: 3px 11px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-top: 10px;
    }

    /* Score card */
    .pp-score-card {
      margin-top: 52px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      min-width: 150px;
      flex-shrink: 0;
    }
    .pp-score-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }
    .pp-score-big {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .pp-score-of {
      font-size: 18px;
      font-weight: 400;
      color: var(--text-3);
    }
    .pp-score-stars {
      display: flex;
      justify-content: center;
      gap: 2px;
      margin-top: 8px;
    }
    .pp-star { font-size: 13px; transition: color .1s; }
    .pp-score-sub {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 8px;
      font-family: var(--mono);
    }

    /* Sections */
    .pp-section {
      padding: 20px 28px;
      border-top: 1px solid var(--line);
    }
    .pp-section-lbl {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .pp-bio-text { font-size: 13.5px; color: var(--text-2); line-height: 1.65; }
    .pp-empty { color: var(--text-3); font-style: italic; font-size: 13px; }
    .pp-bio-edit { display: flex; flex-direction: column; gap: 6px; }
    .pp-bio-input {
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 12px 14px;
      resize: vertical;
      outline: none;
      width: 100%;
    }
    .pp-bio-input:focus { border-color: var(--accent); }
    .pp-bio-counter { font-family: var(--mono); font-size: 10px; color: var(--text-3); text-align: right; }

    /* Grid 2 cards */
    .pp-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-top: 1px solid var(--line);
    }
    .pp-card {
      padding: 20px 28px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .pp-card:last-child { border-right: none; }
    .pp-card-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* Empty state */
    .pp-empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-3);
      font-size: 13px;
      line-height: 1.5;
    }
    .pp-empty-icon { font-size: 28px; margin-bottom: 10px; }

    /* Interacciones */
    .pp-interaction {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pp-interaction:last-child { border-bottom: none; }
    .pp-int-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .pp-int-country { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
    .pp-int-ts { font-size: 10px; color: var(--text-3); flex-shrink: 0; }
    .pp-int-thread { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pp-int-text { font-size: 12px; color: var(--text-2); line-height: 1.5; font-style: italic; }
    .pp-int-likes { font-size: 10px; color: var(--text-3); margin-top: 2px; }

    /* Países de interés */
    .pp-country-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .pp-country-row:last-child { border-bottom: none; }
    .pp-cr-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .pp-cr-rank { font-size: 10px; color: var(--text-3); min-width: 18px; }
    .pp-cr-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .pp-cr-region { font-size: 10px; color: var(--text-3); margin-top: 1px; }
    .pp-cr-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; min-width: 100px; }
    .pp-cr-bar-wrap {
      flex: 1;
      height: 4px;
      background: var(--bg-3);
      border-radius: 2px;
      overflow: hidden;
    }
    .pp-cr-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .3s;
    }
    .pp-cr-count { font-size: 10px; color: var(--text-3); min-width: 42px; text-align: right; }

    /* Reputation track */
    .pp-rep-track-section { border-bottom: 1px solid var(--line); }
    .pp-rep-track {
      display: flex;
      gap: 0;
      align-items: flex-start;
    }
    .pp-rep-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 4px;
      opacity: 0.3;
      transition: opacity .2s;
      position: relative;
    }
    .pp-rep-step::after {
      content: "";
      position: absolute;
      top: 18px;
      right: -50%;
      width: 100%;
      height: 2px;
      background: var(--line-2);
    }
    .pp-rep-step:last-child::after { display: none; }
    .pp-rep-step.reached { opacity: 1; }
    .pp-rep-step.reached::after { background: var(--accent); }
    .pp-rep-step.current .pp-rep-step-icon {
      box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px currentColor;
    }
    .pp-rep-step-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--line-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      background: var(--bg-2);
      color: var(--text-3);
      transition: all .2s;
      z-index: 1;
    }
    .pp-rep-step-label { font-size: 10px; font-weight: 600; color: var(--text-2); text-align: center; }
    .pp-rep-step-min { font-size: 9px; color: var(--text-3); font-family: var(--mono); }

    /* ── Starred countries in profile ───────────────────────── */
    .pp-starred-section { border-bottom: 1px solid var(--line); }
    .pp-section-lbl { display: flex; align-items: center; gap: 8px; }
    .pp-starred-count {
      background: var(--accent);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      font-family: var(--mono);
    }
    html[data-theme="dark"] .pp-starred-count { color: #0a0b0d; }
    .pp-starred-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pp-starred-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 160px;
    }
    .pp-sc-star { color: #f59e0b; font-size: 14px; }
    .pp-sc-info { flex: 1; min-width: 0; }
    .pp-sc-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .pp-sc-region { font-size: 10px; color: var(--text-3); margin-top: 1px; }
    .pp-sc-score { font-family: var(--mono); font-size: 13px; font-weight: 700; }

    /* ── Notification bell ────────────────────────────────────── */
    .notif-bell-wrap {
      position: relative;
    }
    .notif-bell {
      background: none;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      color: var(--text-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 32px;
      position: relative;
      transition: all .12s;
    }
    .notif-bell svg { width: 16px; height: 16px; }
    .notif-bell:hover, .notif-bell.open { border-color: var(--accent); color: var(--accent); background: var(--bg-2); }
    .notif-dot {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--bad);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      font-family: var(--mono);
      min-width: 16px;
      height: 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      border: 2px solid var(--bg);
    }

    /* Notification panel dropdown */
    .notif-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 340px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      z-index: 500;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 480px;
    }
    .np-head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .np-title { font-size: 12px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .np-sub { font-size: 10px; color: var(--text-3); font-family: var(--mono); }
    .np-empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--text-3);
      font-size: 12px;
      line-height: 1.5;
    }
    .np-empty-icon { font-size: 24px; color: #f59e0b; margin-bottom: 8px; }
    .np-empty-sub { font-size: 11px; margin-top: 4px; }
    .np-list { overflow-y: auto; flex: 1; }
    .np-list::-webkit-scrollbar { width: 4px; }
    .np-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }
    .np-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background .1s;
    }
    .np-item:last-child { border-bottom: none; }
    .np-item:hover { background: var(--bg-3); }
    .np-item.unread { background: color-mix(in srgb, var(--accent) 5%, var(--bg-2)); }
    .np-item.unread:hover { background: color-mix(in srgb, var(--accent) 10%, var(--bg-2)); }
    .np-item-type { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .np-item-body { flex: 1; min-width: 0; }
    .np-item-country { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
    .np-item-title { font-size: 12px; color: var(--text); line-height: 1.4; margin-top: 2px; }
    .np-item-sub { font-size: 10px; color: var(--text-3); margin-top: 2px; }
    .np-item-ts { font-size: 9px; color: var(--text-3); flex-shrink: 0; margin-top: 3px; white-space: nowrap; }

    /* ── Star button in country focus ────────────────────────── */
    .cf-star-btn { gap: 4px; }
    .cf-star-btn .cf-star-icon { color: var(--text-3); transition: color .15s; }
    .cf-star-btn:hover .cf-star-icon { color: #f59e0b; }
    .cf-star-btn.starred { border-color: #f59e0b; color: #f59e0b; }
    .cf-star-btn.starred .cf-star-icon { color: #f59e0b; }
  </style>

  <script type="application/json" id="speaker-notes">[]</script>
</head>
