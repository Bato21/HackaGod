services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aletheia-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Hot-reload in development: mount source over the image copy.
      - ./app:/app/app
    # --reload picks up the mounted volume changes.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
